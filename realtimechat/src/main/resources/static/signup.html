<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatSystem - Sign Up</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>ChatSystem</h1>

            <p>Create your account</p>

            <form id="signupForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p id="message"></p>

            <div class="login-link">
                Already have an account?
                <a href="index.html">Log in</a>
            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
