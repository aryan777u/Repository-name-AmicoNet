```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AmicoNet - Create Account</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>AmicoNet</h1>

            <p>Create your account</p>

            <form id="signupForm">

                <!-- Username -->
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username"
                    required
                    autocomplete="username"
                >

                <!-- Email -->
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    required
                    autocomplete="email"
                >

                <!-- Password -->
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                    autocomplete="new-password"
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <div class="login-link">
                Already have an account?
                <a href="index.html">
                    Log In
                </a>
            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
```
