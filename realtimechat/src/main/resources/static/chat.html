```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>AmicoNet</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="chat-app">

    <!-- ==============================
         SIDEBAR
    =============================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <h1>AmicoNet</h1>

            <div class="profile-section">

                <img
                    id="profilePhoto"
                    src=""
                    alt="Profile"
                    class="profile-photo"
                    style="display:none;"
                >

                <input
                    type="file"
                    id="profilePhotoInput"
                    accept="image/*"
                    hidden
                >

                <button
                    id="profilePhotoButton"
                    type="button"
                    class="profile-btn"
                    aria-label="Profile photo"
                >
                    👤
                </button>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search chats..."
                autocomplete="off"
            >

        </div>


        <!-- USER LIST -->

        <div
            class="chat-list"
            id="chatList"
        >
        </div>


        <!-- ADD PERSON -->

        <button
            class="add-user-btn"
            id="addUserButton"
            type="button"
        >
            + Add Person
        </button>

    </aside>


    <!-- ==============================
         CHAT AREA
    =============================== -->

    <main class="chat-area" id="chatArea">

        <!-- CHAT HEADER -->

        <header class="chat-header">

            <button
                id="mobileBackButton"
                class="mobile-back-button"
                type="button"
                aria-label="Back"
            >
                ←
            </button>


            <div class="chat-avatar-container">

                <img
                    id="chatProfilePhoto"
                    class="chat-profile-photo"
                    src=""
                    alt="Profile"
                    style="display:none;"
                >

                <div
                    class="avatar"
                    id="chatAvatar"
                >
                    ?
                </div>

            </div>


            <div class="chat-header-info">

                <h2 id="chatName">
                    Select a person
                </h2>

                <span
                    class="online-status"
                    id="onlineStatus"
                >
                    ● Offline
                </span>

            </div>

        </header>


        <!-- MESSAGES -->

        <section
            class="messages"
            id="messages"
        >

            <div class="message received">
                Select a person to start chatting.
            </div>

        </section>


        <!-- MESSAGE INPUT -->

        <footer class="message-input">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
                disabled
            >

            <button
                id="sendButton"
                type="button"
                disabled
            >
                ➤
            </button>

        </footer>

    </main>

</div>


<!-- ==============================
     SOCKJS
=============================== -->

<script
    src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js">
</script>


<!-- ==============================
     STOMP
=============================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js">
</script>


<!-- ==============================
     AMICONET JAVASCRIPT
=============================== -->

<script src="js/app.js"></script>


<!-- ==============================
     MOBILE NAVIGATION
=============================== -->

<script>

const sidebar =
    document.getElementById("sidebar");

const chatArea =
    document.getElementById("chatArea");

const backButton =
    document.getElementById("mobileBackButton");

const chatList =
    document.getElementById("chatList");


function showMobileChat() {

    if (window.innerWidth <= 700) {

        sidebar.classList.add("mobile-hidden");

        chatArea.classList.add("mobile-visible");

    }

}


function showMobileUsers() {

    if (window.innerWidth <= 700) {

        sidebar.classList.remove("mobile-hidden");

        chatArea.classList.remove("mobile-visible");

    }

}


if (chatList) {

    chatList.addEventListener(
        "click",
        function () {

            setTimeout(
                showMobileChat,
                50
            );

        }
    );

}


if (backButton) {

    backButton.addEventListener(
        "click",
        function () {

            showMobileUsers();

        }
    );

}


window.addEventListener(
    "resize",
    function () {

        if (window.innerWidth > 700) {

            sidebar.classList.remove(
                "mobile-hidden"
            );

            chatArea.classList.remove(
                "mobile-visible"
            );

        }

    }
);

</script>

</body>

</html>
```
